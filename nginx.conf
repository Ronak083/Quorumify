server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── React Router: serve index.html for all non-asset routes ──────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API Proxy → quorumify-api Spring Boot service ──────────────────────
    # When running via docker-compose, the Spring container is named
    # "quorumify-api" and listens on port 8080.
    # In Kubernetes, replace "quorumify-api" with the K8s service DNS name.
    location /api/ {
        proxy_pass         http://quorumify-api:8080/api/;
        proxy_set_header   Authorization $http_authorization; # Force pass the header
    proxy_pass_header  Authorization;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # CORS headers (only if Spring app doesn't handle them itself)
        # add_header Access-Control-Allow-Origin * always;
    }

    # ── Security & performance headers ──────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy       "strict-origin" always;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
